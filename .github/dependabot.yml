version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Several Spring Boot lines are tested through profiles; bump majors by hand.
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]
      # ShedLock 7 drops Spring 6.1 (Boot 3.3); the Boot 4 profile sets its own version.
      - dependency-name: "net.javacrumbs.shedlock*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

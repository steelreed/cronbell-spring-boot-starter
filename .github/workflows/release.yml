name: Release

# Runs when a version tag is pushed (v0.1.0, v0.2.0-rc.1). The maintainer pushes the tag;
# see RELEASING.md. Nothing here runs on branches or pull requests.
on:
  push:
    tags: ['v*']

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Tag, POM version and branch agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          pom="$(./mvnw -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout)"
          if [[ "$pom" != "$version" ]]; then
            echo "::error file=pom.xml::pom.xml has version '$pom' but the tag is '$GITHUB_REF_NAME'. Set <version>$version</version> before tagging."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CHANGELOG.md has a dated section for this version
        run: .github/scripts/changelog-notes.sh "${{ steps.version.outputs.version }}"

  publish:
    name: Build, sign and upload to Maven Central
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          # settings.xml with a "central" server matching publishingServerId in the POM
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          # Imports the signing key into the runner's keyring
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # deploy runs the tests (and the minimal-classpath tests) before signing and uploading.
      # Central validates the bundle (waitUntil=validated); publishing it is a click in the
      # Central Portal (autoPublish=false), see RELEASING.md.
      - name: Test, sign and upload
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  github-release:
    name: Create the GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          .github/scripts/changelog-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
